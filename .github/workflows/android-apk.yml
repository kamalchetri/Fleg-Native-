name: Build FLEG Native APK

on:
  workflow_dispatch:
  push:
    branches:
      - feat/fleg-native-ui
    paths:
      - .github/workflows/android-apk.yml
      - App.tsx
      - app.json
      - package.json
      - assets/**

permissions:
  contents: read

jobs:
  android-apk:
    name: Android release APK (UI preview)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CI: "1"
      EXPO_NO_TELEMETRY: "1"
      GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g"
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Expo and React Native dependencies
        run: npm install --no-audit --no-fund

      - name: Generate native Android project
        run: npx expo prebuild --platform android --non-interactive --clean

      - name: Assemble standalone Android release APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Collect release APK
        run: |
          mkdir -p output
          APK="$(find android/app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' | head -n 1)"
          test -n "$APK" && test -s "$APK"
          cp "$APK" output/FLEG-Native-UI-Preview.apk
          sha256sum output/FLEG-Native-UI-Preview.apk > output/SHA256SUMS.txt
          ls -lah output

      - name: Publish APK as downloadable artifact
        uses: actions/upload-artifact@v4
        with:
          name: FLEG-Native-Android-APK
          path: output/
          if-no-files-found: error
          retention-days: 14
